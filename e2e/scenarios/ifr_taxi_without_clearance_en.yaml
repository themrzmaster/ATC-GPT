min_turns: 3
max_turns: 10
rubric_notes: >
  An IFR departure must hold its IFR clearance before taxi. Ground should say "contact Clearance Delivery
  on one two one decimal six five" (or ask if they have their clearance) instead of taxiing them straight away.
