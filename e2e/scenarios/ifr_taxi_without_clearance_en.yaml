category: ground
# IFR aircraft asks Ground for taxi without mentioning an IFR clearance: must get it from Delivery first
airport: KBOS
callsign: N54321
language: en
initial_position: Ground
flight_plan: {aircraft_type: PC12, flight_rules: IFR, destination: KJFK, route: DCT, cruise_altitude_ft: 9000}
start: {lat: 42.3640, lon: -71.0200, alt_ft: 20, heading: 90, on_ground: true, mode: parked}
pilot_goal: >
  You are IFR to JFK at the Signature ramp. Ask Ground for taxi. If told you need your IFR clearance,
  get it from Clearance Delivery (switch frequency), read it back, then go back to Ground for taxi.
  Reply DONE once you have a taxi clearance read back.
pilot_script:
  - "Boston Ground, November five four three two one, Pilatus PC12 at Signature with information Alpha, ready to taxi"
